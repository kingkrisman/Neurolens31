name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a dependency or a browser update that breaks the suite is found on a
  # Monday rather than during a release.
  schedule:
    - cron: "0 6 * * 1"

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 22.11 is below what vite 8 and rolldown ask for (^20.19 || >=22.12), and
  # `22` alone floats to whatever is newest that week. Pinned, so a green run
  # today means the same thing next month.
  NODE_VERSION: "22.12.0"

jobs:
  # Everything that needs no network, no browser and no secrets. This is the
  # job that should be green on every push, and the only one that says
  # anything about the code.
  check:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Deliberately not `cache: npm`.
      # The first version of this cached the npm store, and `npm ci` then failed
      # on every single push while succeeding locally from the same lockfile. A
      # cache keyed on an unchanged lockfile is restored identically forever, so
      # if what it holds is bad the failure is permanent and looks like a code
      # problem. Thirty seconds a run is worth not having a failure mode that
      # cannot be told apart from a real one.
      # Reports its own failure, because the raw logs cannot be read without
      # admin rights on the repository — the API answers 403 — while check-run
      # annotations can. `npm ci` was failing here on every push and succeeding
      # locally from the same lockfile, warm cache and cold, and there was no
      # way to find out why from outside. An error nobody can read is an error
      # nobody can fix.
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          if npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm-ci.log; then
            exit 0
          fi
          echo "::group::npm ci output (tail)"
          tail -n 120 /tmp/npm-ci.log
          echo "::endgroup::"
          grep -E "^npm (error|ERR!)" /tmp/npm-ci.log | head -n 25 | while IFS= read -r line; do
            echo "::error title=npm ci::${line}"
          done
          echo "::error title=npm ci::node $(node -v) npm $(npm -v) on $(uname -sm)"
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Theme contrast
        # No browser needed — the palettes are checked arithmetically, which is
        # the only way to check all fifteen rather than whichever one a test
        # page happened to load.
        run: node scripts/audit-themes.mjs

      # `npm run check:auth` is deliberately NOT here. It compares what a
      # *running dev server* resolved against what the next build would use, so
      # with no server to ask it exits 2 — "could not observe", which is its
      # documented contract and not a failure of the code. It would have failed
      # this job on every push. It belongs in the smoke run against a live
      # server, which is where scripts/browser-smoke.mjs already calls it.

  # Needs the app to boot, which needs Supabase keys. Skips itself when they
  # are not configured rather than failing: a missing repository secret is a
  # setup step nobody has done yet, not a broken build, and a red tick that
  # means "you have not set a secret" teaches people to ignore red ticks.
  a11y:
    name: Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Reports its own failure, because the raw logs cannot be read without
      # admin rights on the repository — the API answers 403 — while check-run
      # annotations can. `npm ci` was failing here on every push and succeeding
      # locally from the same lockfile, warm cache and cold, and there was no
      # way to find out why from outside. An error nobody can read is an error
      # nobody can fix.
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          if npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm-ci.log; then
            exit 0
          fi
          echo "::group::npm ci output (tail)"
          tail -n 120 /tmp/npm-ci.log
          echo "::endgroup::"
          grep -E "^npm (error|ERR!)" /tmp/npm-ci.log | head -n 25 | while IFS= read -r line; do
            echo "::error title=npm ci::${line}"
          done
          echo "::error title=npm ci::node $(node -v) npm $(npm -v) on $(uname -sm)"
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility audit
        env:
          # Both ship to the browser anyway — the anon key is public by design,
          # and row-level security is what actually protects the data.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::notice title=Accessibility skipped::Set the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets to run this."
            exit 0
          fi
          npm run test:a11y

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Reports its own failure, because the raw logs cannot be read without
      # admin rights on the repository — the API answers 403 — while check-run
      # annotations can. `npm ci` was failing here on every push and succeeding
      # locally from the same lockfile, warm cache and cold, and there was no
      # way to find out why from outside. An error nobody can read is an error
      # nobody can fix.
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          if npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm-ci.log; then
            exit 0
          fi
          echo "::group::npm ci output (tail)"
          tail -n 120 /tmp/npm-ci.log
          echo "::endgroup::"
          grep -E "^npm (error|ERR!)" /tmp/npm-ci.log | head -n 25 | while IFS= read -r line; do
            echo "::error title=npm ci::${line}"
          done
          echo "::error title=npm ci::node $(node -v) npm $(npm -v) on $(uname -sm)"
          exit 1

      # `build:dev` rather than `build`: it skips the deploy-time migration and
      # the environment check, so it proves the app compiles without needing
      # any secret at all.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:dev

  # The check that would have caught the outage this file was written after: a
  # misspelled Supabase host in the hosting provider's environment, which broke
  # sign-in in production for days while every local check passed.
  env-check:
    name: Environment reachable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check Supabase is reachable and accepts the key
        env:
          NEUROLENS_STRICT_ENV: "1"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::notice title=Environment check skipped::Set the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets to run this."
            exit 0
          fi
          node scripts/check-env.mjs
